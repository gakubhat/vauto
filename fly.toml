# Fly.io configuration for VAuto.
#
# First run, once:
#   fly apps create <your-app-name>        # must be globally unique
#   # set "app" below to that name, then set secrets (see docs/deploy.md)
#   fly deploy
#
# The image is built from ./Dockerfile (multi-stage), so both the dashboard and
# the server are built by Fly.

app = "vauto"
primary_region = "sin" # Singapore - closest region available on the free plan (bom needs a paid org)

[build]

[env]
  NODE_ENV = "production"
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  # CRITICAL: the app runs a 60s scheduler and must receive Meta webhooks 24/7.
  # If this machine is allowed to stop, leads stop dispatching and inbound
  # messages are lost. Never scale this service to zero.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
